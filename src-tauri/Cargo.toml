[package]
name = "baobox"
version = "0.1.0"
description = "本地文件工具箱 — 不上传、无限制、不联网"
authors = ["wwjorker"]
license = "MIT"
repository = "https://github.com/wwjorker/baobox"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "baobox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# 开发构建体积控制：完整调试符号会让 target/ 膨胀到 5 GB 以上。
# line-tables-only 保留崩溃时定位到具体行号的能力，去掉变量级调试信息，
# 通常能砍掉一半以上体积。本机 F 盘空间紧张，这个取舍划算。
[profile.dev]
debug = "line-tables-only"

# 发布构建：优先体积，符合「安装包尽量小」的产品定位
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 图片处理
webp = "0.3"          # 有损 WebP 编码（image crate 只支持无损）
rayon = "1"           # 批量处理并行化
kamadak-exif = "0.5"  # 读 EXIF（判断是否含 GPS）
img-parts = "0.3"     # 剥离 EXIF 段，不重新编码像素
thiserror = "2"

# ---- 阶段 0 高危技术验证依赖 ----
# 风险 10：mozjpeg 需 C/汇编工具链，若编译失败则降级为纯 Rust 编码器
mozjpeg = "0.10"
# 风险 11：WinRT 系统 OCR 引擎（零体积、纯离线）
windows = { version = "0.58", features = [
  "Media_Ocr",
  "Graphics_Imaging",
  "Storage",
  "Storage_Streams",
  "Globalization",
  "Foundation",
  "Foundation_Collections",
  # WinRT 调用要求线程先完成 COM 初始化，否则 IAsyncOperation::get() 会挂死
  "Win32_System_Com",
  # 系统自带的 PDF 渲染。有了它 PDF 转图片就不用 pdfium，
  # 省下约 11 MB 的动态库，安装包能保持在 6 MB 量级。
  "Data_Pdf",
] }
# 风险 2：PDF 结构操作 + 中文字体子集化嵌入
lopdf = { version = "0.34", features = ["embed_image"] }
ttf-parser = "0.25"
# 中文字体子集化（风险 2）。微软雅黑 18.8 MB 且受版权保护不得随包分发，
# 只能读系统字体、把用到的那几十个字形抽出来嵌进 PDF。
# typst 团队维护，MIT/Apache 双授权，不会有 GPL 传染。
subsetter = "0.2"
# 图片编解码主力
image = "0.25"
oxipng = { version = "9", default-features = false, features = ["parallel"] }

