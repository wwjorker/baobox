name: Release

# 打 tag 就出安装包。手动构建上传这种事做三次就会出错一次，
# 而且没人能验证发布的二进制和仓库里的代码是同一份。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # Rust 依赖有 400 多个，冷编译要几分钟，缓存能省一大半
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run tauri build

      # 没有代码签名证书，SmartScreen 会提示「未知发布者」。
      # 所以必须提供校验值，让用户至少能确认下载的东西没被掉包。
      - name: Compute checksums
        shell: pwsh
        run: |
          $dir = "src-tauri/target/release/bundle"
          $files = Get-ChildItem $dir -Recurse -Include *.exe,*.msi
          $lines = foreach ($f in $files) {
            "{0}  {1}" -f (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower(), $f.Name
          }
          $lines | Out-File -FilePath SHA256SUMS.txt -Encoding utf8
          Get-Content SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            SHA256SUMS.txt
